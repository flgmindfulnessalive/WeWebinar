# Cloudflare Worker + Static Assets para activatuvida.life
# Sirve /X39 y reenvía el resto del dominio al sitio de Canva.
# Requisitos y orden de pasos: docs/DESPLIEGUE.md.
# NO desplegar ni cambiar DNS sin autorización del propietario.
name = "activatuvida-x39"
main = "worker.js"
compatibility_date = "2026-09-01"

# El Worker atiende todo el dominio (el DNS apunta a Cloudflare, proxied).
routes = [
  { pattern = "activatuvida.life/*", zone_name = "activatuvida.life" },
]

[vars]
# Dominio gratuito de Canva reservado: activatuvida-x39.my.canva.site
# Se completa el día del lanzamiento con la URL exacta que muestre Canva al
# publicar ahí (puede incluir una subruta, p. ej. …my.canva.site/<sitio>).
# Mientras esté vacío, el resto del dominio sigue yendo a su origen normal.
CANVA_ORIGIN = ""

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"
