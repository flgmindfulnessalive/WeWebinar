# Cloudflare Worker + Static Assets para activatuvida.life
# Sirve /X39; «/» redirige a /X39. (Opcional: reenviar el resto a Canva.)
# Requisitos y orden de pasos: docs/DESPLIEGUE.md.
# NO desplegar ni cambiar DNS sin autorización del propietario.
name = "activatuvida-x39"
main = "worker.js"
compatibility_date = "2026-09-01"

# Dominios personalizados: Cloudflare crea los registros DNS y el
# certificado. Requiere que la zona activatuvida.life esté en Cloudflare
# y que no existan registros A/CNAME previos para @ ni www.
routes = [
  { pattern = "activatuvida.life", custom_domain = true },
  { pattern = "www.activatuvida.life", custom_domain = true },
]

[vars]
# Vacío = el dominio es solo de esta página (decisión del propietario,
# 25-sep-2026). Para volver a mostrar la web de Canva en el resto de rutas,
# poner la URL de activatuvida-x39.my.canva.site donde esté publicada.
CANVA_ORIGIN = ""

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"
