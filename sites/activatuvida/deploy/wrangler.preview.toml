# Vista previa en https://activatuvida-x39-preview.<tu-subdominio>.workers.dev
# No toca el DNS ni el dominio activatuvida.life.
name = "activatuvida-x39-preview"
main = "worker.js"
compatibility_date = "2026-09-01"
